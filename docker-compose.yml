name: localsound

services:
  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/localsound
      YOUTUBE_COOKIES_FROM_BROWSER: false
    ports:
      - "8080:8080"
    volumes: 
     - ./cookies:/app/cookies

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: localsound
      POSTGRES_USER: localsound
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: